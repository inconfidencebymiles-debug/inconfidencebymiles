<style>
:root {
  --color-bg: #0C0A08;
  --color-red: #A0151C;
  --color-gold: #D4A85A;
  --color-gold-light: #E7BE78;
  --color-cream: #E8E0D0;
  --color-cream-dim: rgba(232, 224, 208, 0.65);
  --font-display: 'Zodiak', 'Georgia', serif;
  --font-body: 'General Sans', 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--color-bg);
  color: var(--color-cream);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  overflow-x: hidden;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(160, 21, 28, 0.15) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.75rem;
  max-width: 720px;
  width: 100%;
}

.back-link {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  color: var(--color-cream-dim);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  transition: color 0.2s;
  z-index: 10;
}
.back-link:hover { color: var(--color-gold); }

.brand {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2rem);
  color: var(--color-cream);
  letter-spacing: 0.02em;
  text-align: center;
}
.brand__accent {
  color: var(--color-gold);
  font-style: italic;
}

.subtitle {
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-cream-dim);
  text-align: center;
}

.video-wrap {
  position: relative;
  width: 100%;
  max-width: 380px;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow:
    0 0 0 1px rgba(212, 168, 90, 0.15),
    0 20px 60px rgba(0, 0, 0, 0.6),
    0 0 80px rgba(160, 21, 28, 0.2);
}

.video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cta-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 0.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 1.5rem;
  border-radius: 999px;
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 0.03em;
  font-weight: 500;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  cursor: pointer;
}
.btn--primary {
  background: var(--color-gold);
  color: #020202;
}
.btn--primary:hover {
  background: var(--color-gold-light);
  transform: translateY(-1px);
}
.btn--ghost {
  color: var(--color-cream);
  border-color: rgba(232, 224, 208, 0.3);
}
.btn--ghost:hover {
  border-color: var(--color-gold);
  color: var(--color-gold);
}

.foot {
  margin-top: 1rem;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: rgba(232, 224, 208, 0.4);
  text-align: center;
}

@media (max-width: 600px) {
  .back-link { top: 1rem; left: 1rem; }
  .video-wrap { max-width: 320px; }
}
